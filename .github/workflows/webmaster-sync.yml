name: Sync Yandex Webmaster

on:
  schedule:
    - cron: '0 5 * * 1'  # Каждый понедельник в 8:00 МСК
  workflow_dispatch:       # Ручной запуск из GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Webmaster data
        env:
          WM_TOKEN: ${{ secrets.WM_TOKEN }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, urllib.parse, datetime, sys

          token = os.environ.get('WM_TOKEN', '')
          if not token:
              print('WM_TOKEN not set', file=sys.stderr)
              sys.exit(1)

          headers = {'Authorization': f'OAuth {token}'}
          BASE = 'https://api.webmaster.yandex.net/v4'

          def api(path, method='GET', body=None):
              url = BASE + path
              req = urllib.request.Request(url, headers=headers, method=method)
              if body:
                  req.add_header('Content-Type', 'application/json')
                  req.data = json.dumps(body).encode()
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  body_text = e.read().decode('utf-8', errors='replace')
                  print(f'HTTP {e.code} {path}: {body_text}', file=sys.stderr)
                  raise

          # User ID
          user_id = api('/user/')['user_id']
          print(f'User ID: {user_id}')

          # Hosts
          hosts = api(f'/user/{user_id}/hosts').get('hosts', [])
          if not hosts:
              print('No hosts found', file=sys.stderr)
              sys.exit(1)
          host = hosts[0]
          host_id  = host['host_id']
          host_url = host.get('unicode_host_url', host.get('ascii_host_url', ''))
          encoded  = urllib.parse.quote(host_id, safe='')
          print(f'Host: {host_url} ({host_id})')

          # Date range: last 28 days
          today     = datetime.date.today()
          date_to   = today.isoformat()
          date_from = (today - datetime.timedelta(days=27)).isoformat()

          # Query analytics — text_indicator='QUERY' возвращает поисковые запросы
          body = {
              'date_from':             date_from,
              'date_to':               date_to,
              'limit':                 200,
              'offset':                0,
              'text_indicator':        'QUERY',
              'device_type_indicator': 'ALL',
          }
          raw = api(f'/user/{user_id}/hosts/{encoded}/query-analytics/list', 'POST', body)

          queries = []
          items = raw.get('text_indicator_to_statistics', [])
          for item in items:
              text_indicator = item.get('text_indicator', '')
              text = text_indicator.get('value', '') if isinstance(text_indicator, dict) else text_indicator
              # statistics — список [{field: TOTAL_SHOWS, value: N}, ...]
              stats_raw = item.get('statistics', [])
              s = {}
              if isinstance(stats_raw, list):
                  for stat in stats_raw:
                      key = stat.get('field', '')
                      s[key] = stat.get('value', 0)
              elif isinstance(stats_raw, dict):
                  for k, v in stats_raw.items():
                      s[k] = v.get('value', v) if isinstance(v, dict) else v
              queries.append({
                  'text':     text,
                  'shows':    round(s.get('TOTAL_SHOWS',       0)),
                  'clicks':   round(s.get('TOTAL_CLICKS',      0)),
                  'position': round(s.get('AVG_SHOW_POSITION', 0) * 10) / 10,
                  'ctr':      round(s.get('CTR',               0) * 1000) / 10,
              })
          print(f'Queries: {len(queries)}')

          # Summary (indexed pages)
          indexed = 0
          try:
              sm = api(f'/user/{user_id}/hosts/{encoded}/summary')
              indexed = sm.get('searchable_pages_count', sm.get('in_search_urls_count', 0))
          except Exception as e:
              print(f'Summary error (non-fatal): {e}')

          result = {
              'updated':      date_to,
              'from':         date_from,
              'to':           date_to,
              'hostUrl':      host_url,
              'indexedPages': indexed,
              'queries':      queries,
          }

          with open('webmaster-data.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f'Done: {len(queries)} queries, {indexed} indexed pages')

          # Append weekly snapshot to metrics-history.json
          try:
              with open('metrics-history.json', encoding='utf-8') as f:
                  history = json.load(f)
          except (FileNotFoundError, ValueError):
              history = {'updated': date_to, 'weeks': []}

          qs_with_pos = [q for q in queries if q.get('position', 0) > 0]
          avg_pos = round(sum(q['position'] for q in qs_with_pos) / len(qs_with_pos), 1) if qs_with_pos else 0

          history['weeks'] = [w for w in history.get('weeks', []) if w.get('date') != date_to]
          history['weeks'].insert(0, {
              'date':         date_to,
              'indexedPages': indexed,
              'avgPosition':  avg_pos,
              'queryCount':   len(queries),
          })
          history['weeks'] = history['weeks'][:52]
          history['updated'] = date_to

          with open('metrics-history.json', 'w', encoding='utf-8') as f:
              json.dump(history, f, ensure_ascii=False, indent=2)

          print(f'History: {len(history["weeks"])} weeks recorded')
          EOF

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webmaster-data.json metrics-history.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: update webmaster data $(date -u +%Y-%m-%d)" && git pull --rebase && git push
