name: Check Keyword Rankings

on:
  schedule:
    - cron: '0 6 * * 1'  # Каждый понедельник в 09:00 МСК
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check rankings via Yandex Search API
        env:
          YANDEX_SEARCH_KEY: ${{ secrets.YANDEX_SEARCH_KEY }}
          YANDEX_FOLDER_ID:  ${{ secrets.YANDEX_FOLDER_ID }}
        run: |
          python3 << 'EOF'
          import os, json, base64, urllib.request, datetime, sys, time
          import xml.etree.ElementTree as ET

          api_key   = os.environ.get('YANDEX_SEARCH_KEY', '')
          folder_id = os.environ.get('YANDEX_FOLDER_ID',  '')
          if not api_key or not folder_id:
              print('YANDEX_SEARCH_KEY / YANDEX_FOLDER_ID not set — skipping', file=sys.stderr)
              sys.exit(0)

          with open('tracked-keywords.json', encoding='utf-8') as f:
              data = json.load(f)

          site    = data.get('site', '')
          today   = datetime.date.today().isoformat()
          checked = 0

          for kw in data['keywords']:
              text = kw['text']
              body = json.dumps({
                  'query': {
                      'searchType':      'SEARCH_TYPE_RU',
                      'queryText':       text,
                      'maxPassagesCount': 1,
                  },
                  'sortSpec':  {'sortMode': 'BY_RELEVANCE'},
                  'groupSpec': {'groupMode': 'FLAT', 'groupsOnPage': 100, 'docsInGroup': 1},
                  'folderId':  folder_id,
              }).encode()
              req = urllib.request.Request(
                  'https://searchapi.api.cloud.yandex.net/v2/web/search',
                  data=body,
                  headers={
                      'Authorization': f'Api-Key {api_key}',
                      'Content-Type':  'application/json',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      resp = json.loads(r.read())

                  xml_data = base64.b64decode(resp['rawData'])
                  root = ET.fromstring(xml_data)

                  pos = 0
                  for i, doc in enumerate(root.iter('doc'), 1):
                      url_el = doc.find('url')
                      if url_el is not None and site in (url_el.text or ''):
                          pos = i
                          break

                  positions = [p for p in kw.get('positions', []) if p['date'] != today]
                  positions.insert(0, {'date': today, 'pos': pos})
                  kw['positions'] = positions[:52]
                  checked += 1
                  print(f'[{checked}] {text}: #{pos if pos else "не в топ-100"}')
                  time.sleep(2)
              except Exception as e:
                  print(f'ERROR {text}: {e}', file=sys.stderr)

          data['updated'] = today
          with open('tracked-keywords.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f'\nDone: {checked}/{len(data["keywords"])} keywords checked')
          EOF

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracked-keywords.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: update keyword rankings $(date -u +%Y-%m-%d)" && \
            git pull --rebase && git push
