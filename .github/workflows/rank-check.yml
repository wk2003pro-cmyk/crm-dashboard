name: Check Keyword Rankings

on:
  schedule:
    - cron: '0 6 * * 1'  # Каждый понедельник в 09:00 МСК
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check rankings via Yandex XML
        env:
          YANDEX_XML_USER: ${{ secrets.YANDEX_XML_USER }}
          YANDEX_XML_KEY:  ${{ secrets.YANDEX_XML_KEY }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, urllib.parse, datetime, sys, time
          import xml.etree.ElementTree as ET

          xml_user = os.environ.get('YANDEX_XML_USER', '')
          xml_key  = os.environ.get('YANDEX_XML_KEY',  '')
          if not xml_user or not xml_key:
              print('YANDEX_XML_USER / YANDEX_XML_KEY not set — skipping', file=sys.stderr)
              sys.exit(0)

          with open('tracked-keywords.json', encoding='utf-8') as f:
              data = json.load(f)

          site    = data.get('site', '')
          today   = datetime.date.today().isoformat()
          checked = 0

          for kw in data['keywords']:
              text = kw['text']
              params = urllib.parse.urlencode({
                  'user':    xml_user,
                  'key':     xml_key,
                  'query':   text,
                  'lr':      213,       # Москва (показывает общую выдачу)
                  'l10n':    'ru',
                  'sortby':  'rlv',
                  'filter':  'none',
                  'maxpassages': 1,
                  'groupby': 'attr=.mode=flat.groups-on-page=100.docs-in-group=1',
              })
              url = f'https://yandex.ru/search/xml?{params}'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      content = r.read()

                  root = ET.fromstring(content)
                  pos  = 0
                  for i, doc in enumerate(root.iter('doc'), 1):
                      url_el = doc.find('url')
                      if url_el is not None and site in (url_el.text or ''):
                          pos = i
                          break

                  positions = [p for p in kw.get('positions', []) if p['date'] != today]
                  positions.insert(0, {'date': today, 'pos': pos})
                  kw['positions'] = positions[:52]
                  checked += 1
                  print(f'[{checked}] {text}: #{pos if pos else "не в топ-100"}')
                  time.sleep(2)  # пауза между запросами
              except Exception as e:
                  print(f'ERROR {text}: {e}', file=sys.stderr)

          data['updated'] = today
          with open('tracked-keywords.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f'\nDone: {checked}/{len(data["keywords"])} keywords checked')
          EOF

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracked-keywords.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: update keyword rankings $(date -u +%Y-%m-%d)" && \
            git pull --rebase && git push
