<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="refresh" content="4;url=https://silva-crm-test.wk2003pro.workers.dev" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>СИЛВА CRM переехала</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d1c16;
        color: #f4f0e7;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 0%, rgba(67, 118, 91, 0.28), transparent 45%),
          #0d1c16;
      }

      main {
        width: min(620px, 100%);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid rgba(166, 190, 173, 0.24);
        border-radius: 24px;
        background: rgba(25, 54, 42, 0.88);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
        text-align: center;
      }

      .brand {
        margin: 0 0 28px;
        color: #90b39d;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: 0.28em;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 6vw, 46px);
        line-height: 1.08;
        letter-spacing: -0.035em;
      }

      p {
        margin: 20px auto 30px;
        max-width: 460px;
        color: #c5d2ca;
        font-size: 17px;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 26px;
        border-radius: 12px;
        background: #4f8467;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
        transition: background 160ms ease, transform 160ms ease;
      }

      a:hover { background: #5c9576; transform: translateY(-1px); }
      a:focus-visible { outline: 3px solid #b7d6c2; outline-offset: 4px; }

      small {
        display: block;
        margin-top: 20px;
        color: #89a093;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">СИЛВА</div>
      <h1>CRM переехала</h1>
      <p>Открываем актуальную защищённую версию с аналитикой и рабочими данными.</p>
      <a href="https://silva-crm-test.wk2003pro.workers.dev">Открыть СИЛВА CRM</a>
      <small>Автоматический переход через несколько секунд</small>
    </main>
  </body>
</html>
